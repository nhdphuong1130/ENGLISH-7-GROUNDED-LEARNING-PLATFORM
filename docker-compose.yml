name: ${COMPOSE_PROJECT_NAME:-english7}

services:
  api:
    build:
      context: ./backend
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      ENGLISH7_SERVICE_NAME: ${ENGLISH7_SERVICE_NAME}
      ENGLISH7_API_PREFIX: ${ENGLISH7_API_PREFIX}
      ENGLISH7_DATABASE_URL: ${ENGLISH7_DATABASE_URL}
      ENGLISH7_JWT_SECRET: ${ENGLISH7_JWT_SECRET}
      ENGLISH7_JWT_ALGORITHM: ${ENGLISH7_JWT_ALGORITHM}
      ENGLISH7_ACCESS_TOKEN_MINUTES: ${ENGLISH7_ACCESS_TOKEN_MINUTES}
      ENGLISH7_WORKER_POLL_INTERVAL_SECONDS: ${ENGLISH7_WORKER_POLL_INTERVAL_SECONDS}
      ENGLISH7_NEO4J_URI: ${ENGLISH7_NEO4J_URI}
      ENGLISH7_NEO4J_USER: ${ENGLISH7_NEO4J_USER}
      ENGLISH7_NEO4J_PASSWORD: ${ENGLISH7_NEO4J_PASSWORD}
      ENGLISH7_INGESTION_DEVICE: ${ENGLISH7_INGESTION_DEVICE}
      ENGLISH7_LAYOUT_MODEL_ID: ${ENGLISH7_LAYOUT_MODEL_ID}
      ENGLISH7_LAYOUT_CONFIDENCE_THRESHOLD: ${ENGLISH7_LAYOUT_CONFIDENCE_THRESHOLD}
      ENGLISH7_OCR_ENGINE: ${ENGLISH7_OCR_ENGINE}
      ENGLISH7_OCR_VERSION: ${ENGLISH7_OCR_VERSION}
      ENGLISH7_INGESTION_VERSION: ${ENGLISH7_INGESTION_VERSION}
      ENGLISH7_SOURCE_OBJECT_PREFIX: ${ENGLISH7_SOURCE_OBJECT_PREFIX}
      ENGLISH7_UPLOAD_MAX_BYTES: ${ENGLISH7_UPLOAD_MAX_BYTES}
      ENGLISH7_IMAGE_UPLOAD_PREFIX: ${ENGLISH7_IMAGE_UPLOAD_PREFIX}
      ENGLISH7_IMAGE_UPLOAD_RETENTION_MINUTES: ${ENGLISH7_IMAGE_UPLOAD_RETENTION_MINUTES}
      ENGLISH7_IMAGE_UPLOAD_ALLOWED_TYPES: ${ENGLISH7_IMAGE_UPLOAD_ALLOWED_TYPES}
      ENGLISH7_OCR_LANGUAGES: ${ENGLISH7_OCR_LANGUAGES}
      ENGLISH7_OCR_MINIMUM_CONFIDENCE: ${ENGLISH7_OCR_MINIMUM_CONFIDENCE}
      ENGLISH7_MINIO_ENDPOINT: http://minio:9000
      ENGLISH7_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      ENGLISH7_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      ENGLISH7_MINIO_UPLOAD_BUCKET: ${MINIO_UPLOAD_BUCKET}
      ENGLISH7_NEO4J_VECTOR_INDEX: ${ENGLISH7_NEO4J_VECTOR_INDEX}
      ENGLISH7_EMBEDDING_PROVIDER: ${ENGLISH7_EMBEDDING_PROVIDER}
      ENGLISH7_EMBEDDING_MODEL: ${ENGLISH7_EMBEDDING_MODEL}
      ENGLISH7_EMBEDDING_MODEL_VERSION: ${ENGLISH7_EMBEDDING_MODEL_VERSION}
      ENGLISH7_EMBEDDING_DIMENSIONS: ${ENGLISH7_EMBEDDING_DIMENSIONS}
      ENGLISH7_EMBEDDING_CACHE_DIR: ${ENGLISH7_EMBEDDING_CACHE_DIR}
      ENGLISH7_EMBEDDING_BATCH_SIZE: ${ENGLISH7_EMBEDDING_BATCH_SIZE}
      ENGLISH7_EMBEDDING_QUERY_PREFIX: ${ENGLISH7_EMBEDDING_QUERY_PREFIX}
      ENGLISH7_EMBEDDING_PASSAGE_PREFIX: ${ENGLISH7_EMBEDDING_PASSAGE_PREFIX}
      ENGLISH7_EMBEDDING_PREPROCESSING_VERSION: ${ENGLISH7_EMBEDDING_PREPROCESSING_VERSION}
      ENGLISH7_KNOWLEDGE_GRAPH_INDEX_TIMEOUT_SECONDS: ${ENGLISH7_KNOWLEDGE_GRAPH_INDEX_TIMEOUT_SECONDS}
      ENGLISH7_RETRIEVAL_TOP_K: ${ENGLISH7_RETRIEVAL_TOP_K}
      ENGLISH7_RETRIEVAL_MIN_SCORE: ${ENGLISH7_RETRIEVAL_MIN_SCORE}
      ENGLISH7_RETRIEVAL_GRAPH_DEPTH: ${ENGLISH7_RETRIEVAL_GRAPH_DEPTH}
      ENGLISH7_RETRIEVAL_RRF_CONSTANT: ${ENGLISH7_RETRIEVAL_RRF_CONSTANT}
      ENGLISH7_RETRIEVAL_MAX_CONTEXT_FRAGMENTS: ${ENGLISH7_RETRIEVAL_MAX_CONTEXT_FRAGMENTS}
      ENGLISH7_RETRIEVAL_ALLOWED_UNITS: ${ENGLISH7_RETRIEVAL_ALLOWED_UNITS}
      ENGLISH7_OPENROUTER_API_KEY: ${ENGLISH7_OPENROUTER_API_KEY}
      ENGLISH7_OPENROUTER_ENDPOINT: ${ENGLISH7_OPENROUTER_ENDPOINT}
      ENGLISH7_OPENROUTER_MODEL: ${ENGLISH7_OPENROUTER_MODEL}
      ENGLISH7_OPENROUTER_TIMEOUT_SECONDS: ${ENGLISH7_OPENROUTER_TIMEOUT_SECONDS}
      ENGLISH7_OPENROUTER_EMBEDDING_ENDPOINT: ${ENGLISH7_OPENROUTER_EMBEDDING_ENDPOINT}
      ENGLISH7_OPENROUTER_EMBEDDING_MODEL: ${ENGLISH7_OPENROUTER_EMBEDDING_MODEL}
      ENGLISH7_TUTOR_QUERY_MAX_CHARACTERS: ${ENGLISH7_TUTOR_QUERY_MAX_CHARACTERS}
      ENGLISH7_QUIZ_DUPLICATE_THRESHOLD: ${ENGLISH7_QUIZ_DUPLICATE_THRESHOLD}
      ENGLISH7_QUIZ_MAX_AUDIO_PLAYS: ${ENGLISH7_QUIZ_MAX_AUDIO_PLAYS}
      ENGLISH7_CLICKSEND_USERNAME: ${ENGLISH7_CLICKSEND_USERNAME:-}
      ENGLISH7_CLICKSEND_API_KEY: ${ENGLISH7_CLICKSEND_API_KEY:-}
      PYTHONPATH: /app/src
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_HOST_PORT}:8000"
    volumes:
      - fastembed-cache:/app/cache/fastembed
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests:ro
      - ./backend/alembic:/app/alembic:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro
    command: ["uvicorn", "english7.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          urllib.request.urlopen('http://localhost:8000' + os.environ['ENGLISH7_API_PREFIX'] + '/health')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker-gpu:
    profiles: ["gpu"]
    build:
      context: ./backend
      target: vision
    env_file:
      - path: .env
        required: false
    command: ["python", "-m", "english7.worker"]
    environment:
      ENGLISH7_DATABASE_URL: ${ENGLISH7_DATABASE_URL}
      ENGLISH7_WORKER_POLL_INTERVAL_SECONDS: ${ENGLISH7_WORKER_POLL_INTERVAL_SECONDS}
      ENGLISH7_NEO4J_URI: ${ENGLISH7_NEO4J_URI}
      ENGLISH7_NEO4J_USER: ${ENGLISH7_NEO4J_USER}
      ENGLISH7_NEO4J_PASSWORD: ${ENGLISH7_NEO4J_PASSWORD}
      ENGLISH7_INGESTION_DEVICE: cuda
      ENGLISH7_LAYOUT_MODEL_ID: ${ENGLISH7_LAYOUT_MODEL_ID}
      ENGLISH7_LAYOUT_CONFIDENCE_THRESHOLD: ${ENGLISH7_LAYOUT_CONFIDENCE_THRESHOLD}
      ENGLISH7_OCR_ENGINE: ${ENGLISH7_OCR_ENGINE}
      ENGLISH7_OCR_VERSION: ${ENGLISH7_OCR_VERSION}
      ENGLISH7_INGESTION_VERSION: ${ENGLISH7_INGESTION_VERSION}
      ENGLISH7_SOURCE_OBJECT_PREFIX: ${ENGLISH7_SOURCE_OBJECT_PREFIX}
      ENGLISH7_UPLOAD_MAX_BYTES: ${ENGLISH7_UPLOAD_MAX_BYTES}
      ENGLISH7_IMAGE_UPLOAD_PREFIX: ${ENGLISH7_IMAGE_UPLOAD_PREFIX}
      ENGLISH7_OCR_LANGUAGES: ${ENGLISH7_OCR_LANGUAGES}
      ENGLISH7_OCR_MINIMUM_CONFIDENCE: ${ENGLISH7_OCR_MINIMUM_CONFIDENCE}
      ENGLISH7_MINIO_ENDPOINT: http://minio:9000
      ENGLISH7_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      ENGLISH7_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      ENGLISH7_MINIO_UPLOAD_BUCKET: ${MINIO_UPLOAD_BUCKET}
      PYTHONPATH: /app/src
    volumes:
      - ./backend/src:/app/src
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      target: vision
    env_file:
      - path: .env
        required: false
    command: ["python", "-m", "english7.worker"]
    environment:
      ENGLISH7_DATABASE_URL: ${ENGLISH7_DATABASE_URL}
      ENGLISH7_WORKER_POLL_INTERVAL_SECONDS: ${ENGLISH7_WORKER_POLL_INTERVAL_SECONDS}
      ENGLISH7_NEO4J_URI: ${ENGLISH7_NEO4J_URI}
      ENGLISH7_NEO4J_USER: ${ENGLISH7_NEO4J_USER}
      ENGLISH7_NEO4J_PASSWORD: ${ENGLISH7_NEO4J_PASSWORD}
      ENGLISH7_INGESTION_DEVICE: ${ENGLISH7_INGESTION_DEVICE}
      ENGLISH7_LAYOUT_MODEL_ID: ${ENGLISH7_LAYOUT_MODEL_ID}
      ENGLISH7_LAYOUT_CONFIDENCE_THRESHOLD: ${ENGLISH7_LAYOUT_CONFIDENCE_THRESHOLD}
      ENGLISH7_OCR_ENGINE: ${ENGLISH7_OCR_ENGINE}
      ENGLISH7_OCR_VERSION: ${ENGLISH7_OCR_VERSION}
      ENGLISH7_INGESTION_VERSION: ${ENGLISH7_INGESTION_VERSION}
      ENGLISH7_SOURCE_OBJECT_PREFIX: ${ENGLISH7_SOURCE_OBJECT_PREFIX}
      ENGLISH7_UPLOAD_MAX_BYTES: ${ENGLISH7_UPLOAD_MAX_BYTES}
      ENGLISH7_IMAGE_UPLOAD_PREFIX: ${ENGLISH7_IMAGE_UPLOAD_PREFIX}
      ENGLISH7_OCR_LANGUAGES: ${ENGLISH7_OCR_LANGUAGES}
      ENGLISH7_OCR_MINIMUM_CONFIDENCE: ${ENGLISH7_OCR_MINIMUM_CONFIDENCE}
      ENGLISH7_MINIO_ENDPOINT: http://minio:9000
      ENGLISH7_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      ENGLISH7_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      ENGLISH7_MINIO_UPLOAD_BUCKET: ${MINIO_UPLOAD_BUCKET}
      PYTHONPATH: /app/src
    volumes:
      - ./backend/src:/app/src
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy

  sqlserver:
    image: ${SQLSERVER_IMAGE}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${SQLSERVER_EDITION}
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD}
    ports:
      - "${SQLSERVER_HOST_PORT}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" >/dev/null
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  sqlserver-init:
    image: ${SQLSERVER_IMAGE}
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD}
      SQLSERVER_DATABASE: ${SQLSERVER_DATABASE}
    entrypoint:
      - /bin/bash
      - -ec
      - |
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C \
          -Q "IF DB_ID(N'$${SQLSERVER_DATABASE}') IS NULL CREATE DATABASE [$${SQLSERVER_DATABASE}]"

  neo4j:
    image: ${NEO4J_IMAGE}
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
    ports:
      - "${NEO4J_HTTP_HOST_PORT}:7474"
      - "${NEO4J_BOLT_HOST_PORT}:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio:
    image: ${MINIO_IMAGE}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_HOST_PORT}:9000"
      - "${MINIO_CONSOLE_HOST_PORT}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: ${MINIO_MC_IMAGE}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_MEDIA_BUCKET: ${MINIO_MEDIA_BUCKET}
      MINIO_UPLOAD_BUCKET: ${MINIO_UPLOAD_BUCKET}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_MEDIA_BUCKET}"
        mc mb --ignore-existing "local/$${MINIO_UPLOAD_BUCKET}"

volumes:
  sqlserver-data:
  neo4j-data:
  neo4j-logs:
  minio-data:
  fastembed-cache:
